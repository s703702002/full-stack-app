services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Mission
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio:RELEASE.2024-04-18T19-09-19Z
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: myaccesskey
      MINIO_ROOT_PASSWORD: mysecretkey
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  minio-init:
    image: minio/mc:RELEASE.2024-04-18T16-58-46Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 myaccesskey mysecretkey); do echo '等待 MinIO 啟動中...'; sleep 1; done;
      if ! /usr/bin/mc ls myminio/mission > /dev/null 2>&1; then
        /usr/bin/mc mb myminio/mission;
        /usr/bin/mc policy set download myminio/mission;
        echo 'Bucket \"mission\" 建立成功並已開啟公開下載權限！';
      else
        echo 'Bucket \"mission\" 已經存在，跳過建立。';
      fi;
      exit 0;
      "

volumes:
  postgres_data:
  minio_data: